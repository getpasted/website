<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copycat Rig Inspector</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2f7f5;
        --muted: #8e9b98;
        --mint: #65e6b4;
        --line: rgba(101, 230, 180, 0.22);
        --panel: #0c1516;
        --page: #070d0e;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 25% 42%, rgba(101, 230, 180, 0.08), transparent 34%),
          var(--page);
        color: var(--ink);
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(101, 230, 180, 0.07);
        color: var(--ink);
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }

      button:hover, button[aria-pressed="true"] {
        border-color: var(--mint);
        color: var(--mint);
      }

      .shell { width: min(1800px, 100%); margin: 0 auto; padding: 24px; }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 { margin: 0 0 4px; font: 700 clamp(24px, 3vw, 42px)/1.05 system-ui, sans-serif; }
      p { margin: 0; color: var(--muted); }
      .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

      .workbench {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }

      .panel {
        position: relative;
        min-height: min(76vh, 900px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background:
          linear-gradient(rgba(101,230,180,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(101,230,180,.035) 1px, transparent 1px),
          var(--panel);
        background-size: 40px 40px;
      }

      .panel-label {
        position: absolute;
        z-index: 20;
        top: 18px;
        left: 20px;
        color: var(--mint);
        letter-spacing: .14em;
        font-size: 12px;
      }

      .artboard {
        position: absolute;
        inset: 56px 22px 22px;
        display: grid;
        place-items: center;
      }

      .rig, .master {
        position: relative;
        width: min(100%, 780px);
        aspect-ratio: 723 / 890;
        transform: scaleX(-1);
      }
      .rig { transform-origin: 50% 100%; animation: little-hop 8.4s linear 1.6s infinite; }

      .master img, .copycat-rig-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .copycat-rig-svg { display: block; overflow: visible; }
      .layer, .layer use {
        transform-box: fill-box;
        fill-rule: evenodd;
        clip-rule: evenodd;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-miterlimit: 1.5;
      }
      .layer-head { transform-origin: 52% 82%; animation: head 6.3s ease-in-out infinite; }
      .layer-front-arm { transform-origin: 92% 47%; animation: bat 1.55s cubic-bezier(.42,0,.22,1) infinite; }
      .layer-back-arm { transform-origin: 90% 48%; animation: back-arm 2.6s cubic-bezier(.42,0,.22,1) -.65s infinite; }
      .layer-tail { transform-origin: 10% 82%; animation: tail 3.4s ease-in-out infinite; }
      .layer-back-leg { transform-origin: 82% 10%; animation: rear-leg 7.8s ease-in-out -.9s infinite, back-foot-hop 8.4s linear 1.6s infinite; }
      .layer-front-leg { transform-origin: 52% 10%; animation: front-leg 7.8s ease-in-out -.9s infinite, front-foot-hop 8.4s linear 1.6s infinite; }

      .paused *, .paused { animation-play-state: paused !important; }
      .hidden-layer { visibility: hidden; }

      .layer-dock {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 14px;
      }

      .layer-dock button { padding: 6px 10px; font-size: 12px; }
      .layer-dock button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }

      .tip { margin-top: 13px; font-size: 12px; }

      @keyframes head {
        0%,100% { transform: translate(0,0) rotate(0); }
        24% { transform: translate(-1.5px,.75px) rotate(-1.8deg); }
        48% { transform: translate(.8px,-1.4px) rotate(1.15deg); }
        74% { transform: translate(1.4px,0) rotate(1.55deg); }
      }
      @keyframes bat {
        0%,10%,38%,100% { transform: rotate(0) translate(0,0); }
        14% { transform: rotate(-17deg) translate(-3px,-3px); }
        18% { transform: rotate(5deg) translate(1px,1px); }
        22% { transform: rotate(-20deg) translate(-4px,-4px); }
        26% { transform: rotate(4deg) translate(1px,0); }
        30% { transform: rotate(-12deg) translate(-2px,-2px); }
        35% { transform: rotate(0) translate(0,0); }
      }
      @keyframes tail {
        0%,100% { transform: translateX(-8px) rotate(-2deg); }
        35% { transform: translateX(-8px) rotate(7.2deg); }
        67% { transform: translateX(-8px) rotate(-4.8deg); }
      }
      @keyframes rear-leg {
        0%,100% { transform: rotate(0); }
        18% { transform: rotate(-1.1deg); }
        34% { transform: rotate(.8deg); }
        52% { transform: rotate(-.65deg); }
        68% { transform: rotate(.45deg); }
        76% { transform: rotate(0); }
        80% { transform: rotate(-1.8deg); }
        84% { transform: rotate(.9deg); }
        88% { transform: rotate(0); }
      }
      @keyframes front-leg {
        0%,100% { transform: translateY(0) rotate(0); }
        18% { transform: translateY(.4px) rotate(.9deg); }
        34% { transform: translateY(-.3px) rotate(-.7deg); }
        52% { transform: translateY(.25px) rotate(.55deg); }
        68% { transform: translateY(-.2px) rotate(-.4deg); }
        76% { transform: translateY(0) rotate(0); }
        80% { transform: translateY(1.8px) rotate(-1.3deg); }
        84% { transform: translateY(-.8px) rotate(.65deg); }
        88% { transform: translateY(0) rotate(0); }
      }
      @keyframes back-arm {
        0%,48%,72%,100% { transform: rotate(0) translate(0,0); }
        53% { transform: rotate(-13deg) translate(-3px,-3px); }
        58% { transform: rotate(5deg) translate(1px,1px); }
        63% { transform: rotate(-9deg) translate(-2px,-2px); }
        68% { transform: rotate(2deg) translate(0,0); }
      }
      @keyframes little-hop {
        0%,72%,100% { transform: scaleX(-1) translateY(0) scale(1); }
        75% { transform: scaleX(-1) translateY(1px) scaleX(1.018) scaleY(.982); }
        77% { transform: scaleX(-1) translateY(2.5px) scaleX(1.04) scaleY(.955); }
        78.5% { transform: scaleX(-1) translateY(-6px) scaleX(.982) scaleY(1.025); }
        79.5% { transform: scaleX(-1) translateY(-21px) scaleX(.992) scaleY(1.012); }
        80.5% { transform: scaleX(-1) translateY(-31px) scale(1); }
        81% { transform: scaleX(-1) translateY(-27px) scaleX(1.003) scaleY(.997); }
        82% { transform: scaleX(-1) translateY(-12px) scaleX(1.01) scaleY(.99); }
        82.8% { transform: scaleX(-1) translateY(2px) scaleX(1.06) scaleY(.94); }
        85% { transform: scaleX(-1) translateY(0) scaleX(1.025) scaleY(.975); }
        87% { transform: scaleX(-1) translateY(-2px) scaleX(.99) scaleY(1.01); }
        90% { transform: scaleX(-1) translateY(0) scale(1); }
      }
      @keyframes back-foot-hop {
        0%,74%,100% { rotate: 0deg; scale: 1; }
        75% { rotate: 0deg; scale: 1.02 .96; }
        77% { rotate: 0deg; scale: 1.05 .9; }
        78.5% { rotate: -12deg; scale: .98 1.03; }
        79.3% { rotate: -5deg; scale: 1; }
        80.5%,82.7% { rotate: 8deg; scale: 1; }
        82.8% { rotate: 0deg; scale: 1.07 .9; }
        83.7% { rotate: 0deg; scale: 1.02 .98; }
        86%,90% { rotate: 0deg; scale: 1; }
      }
      @keyframes front-foot-hop {
        0%,74%,100% { rotate: 0deg; scale: 1; }
        75% { rotate: 0deg; scale: 1.02 .96; }
        77% { rotate: 0deg; scale: 1.05 .9; }
        78.5% { rotate: -12deg; scale: .98 1.03; }
        79.3% { rotate: -5deg; scale: 1; }
        80.5%,82.7% { rotate: 8deg; scale: 1; }
        82.8% { rotate: 0deg; scale: 1.07 .9; }
        83.7% { rotate: 0deg; scale: 1.02 .98; }
        86%,90% { rotate: 0deg; scale: 1; }
      }

      @media (max-width: 900px) {
        header { align-items: flex-start; flex-direction: column; }
        .controls { justify-content: flex-start; }
        .workbench { grid-template-columns: 1fr; }
        .panel { min-height: 72vw; }
      }

      @media (prefers-reduced-motion: reduce) {
        .rig * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>Copycat rig inspector</h1>
          <p>Animated sprite stack on the left. Exact approved master on the right.</p>
        </div>
        <div class="controls">
          <button id="pause" type="button" aria-pressed="false">Pause motion</button>
          <button id="reset" type="button">Show all layers</button>
        </div>
      </header>

      <section class="workbench">
        <article class="panel">
          <span class="panel-label">ANIMATED SPRITE ASSEMBLY</span>
          <div class="artboard">
            <div class="rig" id="rig">
              <svg class="copycat-rig-svg" viewBox="0 0 723 890" aria-label="Animated Copycat layer assembly">
                <g transform="translate(-341.923 -160.282)">
                  <g class="layer layer-back-arm" data-layer="back-arm"><use href="/copycat/copycat.svg#Back-Arm" /></g>
                  <g class="layer layer-tail" data-layer="tail"><use href="/copycat/copycat.svg#Tail" /></g>
                  <g class="layer layer-back-leg" data-layer="back-leg"><use href="/copycat/copycat.svg#Back-Leg" /></g>
                  <g class="layer" data-layer="neck"><use href="/copycat/copycat.svg#Neck" /></g>
                  <g class="layer" data-layer="body"><use href="/copycat/copycat.svg#Body" /></g>
                  <g class="layer layer-front-leg" data-layer="front-leg"><use href="/copycat/copycat.svg#Front-Leg" /></g>
                  <g class="layer layer-head" data-layer="head"><use href="/copycat/copycat.svg#Head" /></g>
                  <g class="layer layer-front-arm" data-layer="front-arm"><use href="/copycat/copycat.svg#Front-Arm" /></g>
                </g>
              </svg>
            </div>
          </div>
        </article>

        <article class="panel">
          <span class="panel-label">EXACT MASTER TRACE · REST POSE</span>
          <div class="artboard">
            <div class="master">
              <img src="/copycat/copycat.svg" alt="Approved layered Copycat artwork" />
            </div>
          </div>
        </article>
      </section>

      <nav class="layer-dock" aria-label="Sprite layer visibility">
        <button type="button" data-toggle="back-arm" aria-pressed="true">Back arm</button>
        <button type="button" data-toggle="tail" aria-pressed="true">Tail</button>
        <button type="button" data-toggle="back-leg" aria-pressed="true">Back leg</button>
        <button type="button" data-toggle="neck" aria-pressed="true">Neck</button>
        <button type="button" data-toggle="body" aria-pressed="true">Body</button>
        <button type="button" data-toggle="front-leg" aria-pressed="true">Front leg</button>
        <button type="button" data-toggle="head" aria-pressed="true">Head</button>
        <button type="button" data-toggle="front-arm" aria-pressed="true">Front arm</button>
      </nav>
      <p class="tip">Pause at the bad frame, hide layers to identify the culprit, then screenshot and mark the exact strokes.</p>
    </main>

    <script>
      const cacheKey = Date.now();
      document.querySelectorAll('img[src^="/copycat/"]').forEach((image) => {
        const url = new URL(image.src);
        url.searchParams.set('inspect', cacheKey);
        image.src = url.href;
      });

      const rig = document.querySelector('#rig');
      const pause = document.querySelector('#pause');
      const reset = document.querySelector('#reset');
      const toggles = [...document.querySelectorAll('[data-toggle]')];

      pause.addEventListener('click', () => {
        const paused = rig.classList.toggle('paused');
        pause.setAttribute('aria-pressed', String(paused));
        pause.textContent = paused ? 'Resume motion' : 'Pause motion';
      });

      toggles.forEach((button) => {
        button.addEventListener('click', () => {
          const layer = document.querySelector(`[data-layer="${button.dataset.toggle}"]`);
          const visible = button.getAttribute('aria-pressed') !== 'false';
          button.setAttribute('aria-pressed', String(!visible));
          layer.classList.toggle('hidden-layer', visible);
        });
      });

      reset.addEventListener('click', () => {
        document.querySelectorAll('[data-layer]').forEach((layer) => layer.classList.remove('hidden-layer'));
        toggles.forEach((button) => button.setAttribute('aria-pressed', 'true'));
      });

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && event.target === document.body) {
          event.preventDefault();
          pause.click();
        }
      });
    </script>
  </body>
</html>
